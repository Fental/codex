name: harness-client-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example harness-client-2026.07.28.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: harness-client-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            libc: musl
            include_bwrap: true
          - platform: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            libc: musl
            include_bwrap: true
          - platform: linux-x86_64-gnu
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            libc: glibc
            include_bwrap: true
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-14
            libc: darwin
            include_bwrap: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - if: runner.os == 'Linux'
        name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils file gdb pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - if: matrix.libc == 'musl'
        name: Use hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: matrix.libc == 'musl'
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - if: matrix.libc == 'musl'
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: matrix.libc == 'musl'
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - if: matrix.include_bwrap
        name: Build bwrap and export digest
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --locked --release --package codex-bwrap --bin bwrap --target "$target"
          bwrap_path="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build customized Codex
        working-directory: codex-rs
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --locked --release --package codex-cli --bin codex --target "${{ matrix.target }}"

      - name: Package Client asset
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          LIBC: ${{ matrix.libc }}
          INCLUDE_BWRAP: ${{ matrix.include_bwrap }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/codex-${PLATFORM}"
          mkdir -p "$root/bin" dist
          cp "codex-rs/target/${TARGET}/release/codex" "$root/bin/codex"
          chmod 0755 "$root/bin/codex"
          if [[ "$INCLUDE_BWRAP" == "true" ]]; then
            mkdir -p "$root/codex-resources"
            cp "codex-rs/target/${TARGET}/release/bwrap" "$root/codex-resources/bwrap"
            chmod 0755 "$root/codex-resources/bwrap"
          fi
          python3 - "$root/manifest.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).parent
          files = {}
          for relative in ("bin/codex", "codex-resources/bwrap"):
              path = root / relative
              if not path.is_file():
                  continue
              files[relative] = {
                  "byte_count": path.stat().st_size,
                  "executable": bool(path.stat().st_mode & 0o111),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(
                  {
                      "schema_version": "harness_client_asset.v2",
                      "client_id": "codex",
                      "platform": os.environ["PLATFORM"],
                      "source_revision": os.environ["SOURCE_REVISION"],
                      "rust_target": os.environ["TARGET"],
                      "libc": os.environ["LIBC"],
                      "files": files,
                  },
                  output,
                  indent=2,
                  sort_keys=True,
              )
              output.write("\n")
          PY
          members=(bin/codex manifest.json)
          if [[ "$INCLUDE_BWRAP" == "true" ]]; then
            members+=(codex-resources/bwrap)
          fi
          tar -C "$root" -czf "dist/codex-${PLATFORM}.tar.gz" "${members[@]}"
          python3 - "dist/codex-${PLATFORM}.tar.gz" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix(path.suffix + ".sha256").write_text(
              f"{digest}  {path.name}\n", encoding="ascii"
          )
          PY

      # Preserve the exact archive even when the executable smoke test fails so
      # release failures can be reproduced without rebuilding the Client.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - name: Smoke test packaged Client
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/smoke-${PLATFORM}"
          mkdir -p "$root"
          tar -C "$root" -xzf "dist/codex-${PLATFORM}.tar.gz"

          if [[ "$PLATFORM" == linux-* ]]; then
            echo "== host =="
            uname -a
            lscpu
            echo "== executable =="
            file "$root/bin/codex"
            ldd "$root/bin/codex" || true
            readelf -h "$root/bin/codex"
            readelf -l "$root/bin/codex"
            readelf -d "$root/bin/codex" || true
          fi

          set +e
          "$root/bin/codex" --version
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            if [[ "$TARGET" == "x86_64-unknown-linux-musl" ]]; then
              gdb -q -batch \
                -ex "set pagination off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                --args "$root/bin/codex" --version || true
            fi
            exit "$status"
          fi

          python3 - "$root/manifest.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          root = manifest_path.parent
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for relative, metadata in manifest["files"].items():
              path = root / relative
              assert path.is_file(), relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == metadata["sha256"]
          PY

  linux-portability:
    name: Test linux-x86_64 on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - rockylinux:9
          - almalinux:9
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-linux-x86_64
          path: dist

      - name: Verify static Client and bundled resource
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir client
          tar -C client -xzf dist/codex-linux-x86_64.tar.gz
          docker run --rm --platform linux/amd64 \
            -v "$PWD/client:/client:ro" \
            "$IMAGE" /client/bin/codex --version
          docker run --rm --platform linux/amd64 \
            -v "$PWD/client:/client:ro" \
            "$IMAGE" sh -c 'test -x /client/codex-resources/bwrap'

  publish:
    name: Publish GitHub Release
    needs: [build, linux-portability]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-*
          path: dist
          merge-multiple: true

      - name: Create aggregate checksums
        run: |
          cd dist
          sha256sum codex-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish immutable Client assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Customized Codex Client for Code Agent RL Harness. Source: $GITHUB_SHA" \
            dist/*
