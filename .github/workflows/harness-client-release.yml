name: harness-client-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example harness-client-2026.07.28.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: harness-client-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Build customized Codex
        working-directory: codex-rs
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --locked --release --package codex-cli --bin codex --target "${{ matrix.target }}"

      - name: Package Client asset
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/codex-${PLATFORM}"
          mkdir -p "$root/bin" dist
          cp "codex-rs/target/${TARGET}/release/codex" "$root/bin/codex"
          chmod 0755 "$root/bin/codex"
          python3 - "$root/manifest.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(
                  {
                      "schema_version": "harness_client_asset.v1",
                      "client_id": "codex",
                      "platform": os.environ["PLATFORM"],
                      "source_revision": os.environ["SOURCE_REVISION"],
                  },
                  output,
                  indent=2,
                  sort_keys=True,
              )
              output.write("\n")
          PY
          tar -C "$root" -czf "dist/codex-${PLATFORM}.tar.gz" bin/codex manifest.json
          python3 - "dist/codex-${PLATFORM}.tar.gz" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix(path.suffix + ".sha256").write_text(
              f"{digest}  {path.name}\n", encoding="ascii"
          )
          PY

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-*
          path: dist
          merge-multiple: true

      - name: Create aggregate checksums
        run: |
          cd dist
          sha256sum codex-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish immutable Client assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Customized Codex Client for Code Agent RL Harness. Source: $GITHUB_SHA" \
            dist/*
